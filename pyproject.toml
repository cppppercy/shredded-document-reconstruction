[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shredded-document-reconstruction"
version = "0.1.0"
description = "Reconstruct vertically shredded synthetic documents with learned compatibility and global optimization."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.1,<3",
  "Pillow>=11,<13",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
demo = ["streamlit>=1.66,<2"]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
